# Configuration file for pre-commit.
#
# Install the pre-commit hooks with `pre-commit install`. This command should
# be run after cloning the repository.
#
# Pre-commit hooks will be run before every commit to help ensure good code
# quality. If any of these hooks fail, the commit will be aborted.
#
# In some cases, pre-commit will make the necessary modifications to satisfy
# the hook criteria. Files modified in this manner must be re-staged with
# `git add <files>` in order for the pre-commit check to pass.

repos:
  # [pre-commit] https://pre-commit.com/hooks.html
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '(.+/templates/.+\.yaml|tests/integration/docker-compose\.integration-test\.yml)'
        args:
          - "--allow-multiple-documents"
      - id: check-json
        exclude: '^\.vscode/'
      - id: check-added-large-files
        # Increased maximum file size to support png images.
        args: [
          "--maxkb=2500"
        ]
      - id: check-shebang-scripts-are-executable
        exclude: '^tools/MCP-Registry/'
      - id: no-commit-to-branch
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ['-c', '.config/pre-commit/.yamllint.yaml']
        exclude: '^tools/MCP-Registry/'

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.config/pre-commit/.secrets.baseline']
        exclude: ^(\.config/pre-commit/\.secrets\.baseline|tools/MCP-Registry/internal/validators/schemas/.*\.json|tools/MCP-Registry/complete\.md|tools/MCP-Registry/data/seed\.json|tools/MCP-Registry/docs/reference/.*\.md|tools/MCP-Registry/docs/modelcontextprotocol-io/.*\.mdx|tools/MCP-Registry/docs/reference/api/openapi\.yaml|tools/MCP-Registry/docs/reference/server-json/.*\.json)$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.9
    hooks:
      - id: actionlint
        # Note: build-x86-devcontainer-image.yml uses custom self-hosted runner labels
        # that actionlint cannot validate without configuration
        exclude: 'build-x86-devcontainer-image\.yml'

  - repo: local
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile linter)
        entry: bash -c 'if command -v hadolint >/dev/null 2>&1; then hadolint --failure-threshold error "$@"; else echo "hadolint not installed, skipping"; exit 0; fi' --
        language: system
        files: (?i)Dockerfile(\.[^/]+)?$
        types: [dockerfile]

  # [markdownlint] https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
  # This hook will check all markdown files in the repository.
  # The markdownlint-cli npm package needs to be installed manually by the developer.
  # The configuration file .markdownlint.json is used to configure the rules.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.46.0
    hooks:
      - id: markdownlint
        name: Checking markdown files
        args: [
          "--config=.config/pre-commit/.markdownlint.json",
          "--ignore-path=.config/pre-commit/.markdownlintignore"
        ]

  # [buildifier] https://github.com/bazelbuild/buildtools/tree/master/buildifier
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.1
    hooks:
      - id: buildifier
        description: Bazel formatter
      - id: buildifier-lint
